<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cristofer Zerpa Portfolio</title>
  <script type="text/javascript">
    // Redirige todas las peticiones al index.html conservando la ruta para que Flutter la maneje
    var segmentCount = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
